name: Release

# Tag-driven: `git tag v1.2.3 && git push --tags` builds and publishes.
# Also runnable by hand from the Actions tab to re-cut a build.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (must already exist)"
        required: true

permissions:
  contents: write # needed to create the release and upload assets

jobs:
  macos:
    runs-on: macos-14 # Apple Silicon runner
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust with both macOS targets
        uses: dtolnay/rust-toolchain@stable
        with:
          # A universal binary needs both slices; without the x86_64 target the
          # app would refuse to launch on Intel Macs.
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Test
        run: |
          npx tsc --noEmit
          cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build universal .app and .dmg
        # No signing identity is configured, so Tauri ad-hoc signs. That means
        # Gatekeeper will quarantine the download — the Homebrew cask and the
        # release notes both tell users how to clear it. Adding a Developer ID
        # here later is the fix; nothing else needs to change.
        run: npm run tauri build -- --target universal-apple-darwin

      - name: Collect artifacts and checksums
        id: artifacts
        run: |
          set -euo pipefail
          BUNDLE=src-tauri/target/universal-apple-darwin/release/bundle
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          mkdir -p dist-release

          # The .dmg is what the cask installs from.
          cp "$BUNDLE/dmg/AKS Fleet Dashboard_${VERSION}_universal.dmg" \
             "dist-release/AKS-Fleet-Dashboard-${VERSION}-universal.dmg"

          # A zipped .app as well, for anyone who'd rather not mount a disk image.
          ditto -c -k --keepParent "$BUNDLE/macos/AKS Fleet Dashboard.app" \
             "dist-release/AKS-Fleet-Dashboard-${VERSION}-universal.app.zip"

          cd dist-release
          shasum -a 256 * | tee SHA256SUMS.txt
          # Surfaced in the job summary so the cask's sha256 can be copied
          # without downloading the asset again.
          {
            echo "### Checksums for the Homebrew cask"
            echo '```'
            cat SHA256SUMS.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify the binary really is universal
        run: |
          set -euo pipefail
          BIN="src-tauri/target/universal-apple-darwin/release/bundle/macos/AKS Fleet Dashboard.app/Contents/MacOS/k8s-view"
          ARCHS=$(lipo -archs "$BIN")
          echo "architectures: $ARCHS"
          # Fail loudly rather than shipping an arm64-only build labelled universal.
          for want in arm64 x86_64; do
            case "$ARCHS" in *"$want"*) ;; *) echo "::error::missing $want slice"; exit 1 ;; esac
          done

      # Retried for the same reason `linux-publish` retries below, which this
      # job had been missing. The action uploads every file in `files:`
      # concurrently, and on 0.7.14 GitHub answered exactly one of the three
      # with a 500 ("Unicorn!") on three consecutive runs — a different asset
      # each time, so it was the concurrency and not any one file. Two of three
      # would land, the job would fail, and the release would sit as a draft
      # advertising assets that were never attached.
      #
      # `continue-on-error` on the first attempt and a plain retry after it: the
      # retry has no `continue-on-error`, so if both fail the job fails there.
      # Re-attaching files that already uploaded is harmless, since the action
      # replaces an asset of the same name.
      - uses: softprops/action-gh-release@v2
        id: publish_macos
        continue-on-error: true
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: dist-release/*
          generate_release_notes: true
          body: |
            ## Install

            ```bash
            brew trust --tap aavishay/aks-fleet-dashboard
            brew tap aavishay/aks-fleet-dashboard
            brew install --cask aks-fleet-dashboard
            ```

            ## Not notarized

            This build is ad-hoc signed, not signed with an Apple Developer ID,
            so macOS quarantines it on first launch. Clear the flag once:

            ```bash
            xattr -dr com.apple.quarantine "/Applications/AKS Fleet Dashboard.app"
            ```

            Universal binary — runs natively on both Apple Silicon and Intel.

      - name: Retry attaching the macOS assets
        if: steps.publish_macos.outcome == 'failure'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: dist-release/*
          # Deliberately no body and no generate_release_notes on the retry: the
          # first attempt sets them even when an asset upload fails afterwards,
          # and repeating `generate_release_notes` would append a second copy of
          # the notes to what is already there.

      # The same backstop `linux-publish` has, and for the same reason: a
      # success from the action is not the same fact as the assets being present
      # under the expected names. Checked by name rather than by count, so a
      # rename in the collect step cannot pass this by keeping the total right.
      #
      # This is also the check that would have caught 0.7.14 without a human
      # noticing: all three runs left a draft holding two of three assets, and
      # nothing downstream looked at what was attached.
      - name: Confirm every macOS asset is actually on the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if [ "${{ steps.publish_macos.outcome }}" = "failure" ]; then
            echo "::warning::attaching the macOS assets failed once and was retried"
          fi
          VERSION="${TAG#v}"
          NAMES=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
          echo "$NAMES"
          MISSING=0
          for want in \
            "AKS-Fleet-Dashboard-${VERSION}-universal.dmg" \
            "AKS-Fleet-Dashboard-${VERSION}-universal.app.zip" \
            "SHA256SUMS.txt"; do
            case "$NAMES" in
              *"$want"*) ;;
              *) echo "::error::the release is missing $want"; MISSING=1 ;;
            esac
          done
          [ "$MISSING" -eq 0 ]

  # Linux amd64, built by the same workflow pull requests run. It holds no
  # write access and produces only an artifact; attaching that artifact to the
  # release is the next job's business.
  linux:
    uses: ./.github/workflows/linux-appimage.yml
    with:
      tag: ${{ github.event.inputs.tag || github.ref_name }}

  # Serialised behind the macOS job on purpose: both attach to one release, and
  # two concurrent "create release" calls race. By this point the macOS job has
  # created it, so this only uploads.
  #
  # Split out from the build so that write access lives here, in a job that runs
  # nothing but a download and an upload, rather than in the reusable workflow
  # that also builds pull request code.
  linux-publish:
    needs: [macos, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: linux-appimage
          path: dist-release

      # Two attempts, for the same reason the artifact upload has them: this is
      # the last mile of a release, the macOS assets are already published by the
      # time it runs, and a single 403 here leaves the release advertising a
      # platform whose asset is missing. Attaching the same files twice is
      # harmless — the action replaces an asset of the same name.
      - uses: softprops/action-gh-release@v2
        id: publish
        continue-on-error: true
        # No body and no generate_release_notes: the macOS job owns those, and
        # setting them again here would overwrite what it wrote.
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: dist-release/*

      - name: Retry attaching the Linux asset
        if: steps.publish.outcome == 'failure'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: dist-release/*

      # Not a guard against a silently-green job: the retry step above has no
      # `continue-on-error`, so if both attempts fail the job fails there. That
      # was wrong when first written.
      #
      # What this actually covers is the quieter case. `continue-on-error` masks
      # the first attempt, and when that attempt reports success nothing else
      # confirms the asset reached the release — a success from the action is not
      # the same fact as an asset being present under the expected name. So ask
      # GitHub what is attached and fail if the AppImage is not among it.
      #
      # Worth being precise about the 0.7.5 incident this whole change came from,
      # since this step would not have caught it: there the artifact upload failed
      # in the build job, so `linux-publish` was skipped entirely and never ran.
      # The retry on that upload is what addresses that; this is the backstop for
      # a publish that runs and claims to have worked.
      - name: Confirm the Linux asset is actually on the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if [ "${{ steps.publish.outcome }}" = "failure" ]; then
            echo "::warning::attaching the Linux asset failed once and was retried"
          fi
          NAMES=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
          echo "$NAMES"
          case "$NAMES" in
            *AppImage*) ;;
            *) echo "::error::the release has no AppImage asset"; exit 1 ;;
          esac
