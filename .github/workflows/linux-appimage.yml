name: Linux AppImage

# One definition, two callers: pull requests build it as a portability check,
# and the release workflow calls it with a tag to publish the asset. Keeping it
# in one place means the release cannot drift from what PRs actually test.
on:
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      tag:
        description: "Release tag, used only to name the asset. Omitted for a build-only check."
        required: false
        type: string
        default: ""

# Read-only, on every trigger. This workflow only ever produces an artifact —
# uploading it to a release is release.yml's job, and that is the only place
# holding write access. So a pull_request run here, which is the one that can
# execute a contributor's code, cannot write to the repository at all.
permissions:
  contents: read

jobs:
  appimage:
    runs-on: ubuntu-22.04 # oldest available glibc, so the AppImage runs on more distros
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # WebKitGTK is the webview Tauri renders into on Linux, the way WKWebView
      # is on macOS. The rest is what packaging an AppImage needs: patchelf to
      # rewrite the bundled libraries' rpaths, librsvg for the icon.
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            patchelf \
            build-essential \
            file

      - run: npm ci

      # Worth running here and not only on macOS: this is the only thing that
      # proves the Rust compiles for Linux at all, keyring backend included.
      - name: Test
        run: |
          npx tsc --noEmit
          cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build the AppImage
        # Only the AppImage: it is what the Homebrew cask installs. The config's
        # "targets": "all" would also produce .deb and .rpm, which nothing here
        # consumes yet.
        #
        # Retried because bundling reaches the network at the very end: Tauri
        # fetches linuxdeploy and its appimage plugin from GitHub releases, and
        # that download returned HTTP 500 twice in one afternoon. Failing the job
        # over someone else's 500 is worse on a release tag than on a PR, since
        # the macOS assets are already published by then and the release ends up
        # missing its Linux half.
        #
        # Cheap to retry despite the job's length: cargo and the frontend build
        # are already done and cached by the first attempt, so a second pass
        # re-runs the bundling rather than the compile. A genuine compile error
        # cannot land here either — `cargo test` above would have failed first —
        # so retrying does not paper over a real break.
        #
        # Each attempt is announced as a warning rather than swallowed: a flake
        # absorbed silently is a flake nobody knows is getting worse.
        run: |
          set -uo pipefail
          for attempt in 1 2 3; do
            if npm run tauri build -- --bundles appimage; then
              [ "$attempt" -gt 1 ] && echo "::warning::AppImage bundling succeeded on attempt $attempt"
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "::warning::AppImage bundling failed on attempt $attempt, retrying"
              sleep $((attempt * 20))
            fi
          done
          echo "::error::AppImage bundling failed three times"
          exit 1

      - name: Name the artifact and checksum it
        id: collect
        run: |
          set -euo pipefail
          # On a build-only run there is no tag, so fall back to the version in
          # the manifest purely to give the file a sensible name.
          TAG="${{ inputs.tag }}"
          if [ -n "$TAG" ]; then
            VERSION="${TAG#v}"
          else
            VERSION=$(node -p "require('./package.json').version")
          fi
          mkdir -p dist-release

          # Tauri names it from productName and version; normalise to the same
          # scheme as the macOS assets so the cask URL is predictable.
          BUILT=$(find src-tauri/target/release/bundle/appimage -maxdepth 1 -name '*.AppImage' -print -quit)
          [ -n "$BUILT" ] || { echo "::error::no AppImage was produced"; exit 1; }
          ASSET="AKS-Fleet-Dashboard-${VERSION}-x86_64.AppImage"
          cp "$BUILT" "dist-release/$ASSET"

          cd dist-release
          # A separate file from the macOS SHA256SUMS.txt: uploading the same
          # name from two jobs would have the second overwrite the first.
          shasum -a 256 "$ASSET" | tee SHA256SUMS-linux.txt
          {
            echo "### Linux amd64 checksum for the Homebrew cask"
            echo '```'
            cat SHA256SUMS-linux.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify the AppImage is a runnable x86-64 executable
        run: |
          set -euo pipefail
          APP=$(find dist-release -name '*.AppImage' -print -quit)
          chmod +x "$APP"
          DESC=$(file -b "$APP")
          echo "file: $DESC"
          # Fail loudly rather than shipping something that is not an amd64 ELF.
          case "$DESC" in
            *ELF*64-bit*x86-64*) ;;
            *) echo "::error::not an x86-64 ELF: $DESC"; exit 1 ;;
          esac
          # --appimage-offset only succeeds on a well-formed AppImage and needs
          # no display, so it is safe on a headless runner. It is not proof the
          # app runs; it is proof the bundle is not malformed.
          "$APP" --appimage-offset >/dev/null

      # The only output. A PR build leaves it here for manual inspection; a
      # release run has release.yml pick it up and attach it to the release.
      #
      # Two attempts, because this is the step that actually cost something: it
      # failed with "Failed to FinalizeArtifact: (403) Forbidden" on the 0.7.5
      # tag, which left `linux-publish` with nothing to download and published a
      # release carrying the macOS assets and no AppImage.
      #
      # Done with `continue-on-error` and a conditional second step rather than a
      # retry action, to avoid adding a third-party action to a release path for
      # something two steps express plainly. `overwrite` is on the retry because
      # a partially-created artifact would otherwise make the second attempt fail
      # as a name collision.
      - uses: actions/upload-artifact@v4
        id: upload
        continue-on-error: true
        with:
          name: linux-appimage
          path: dist-release/*
          if-no-files-found: error

      - name: Retry the upload
        if: steps.upload.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: dist-release/*
          if-no-files-found: error
          overwrite: true

      - name: Say so if the upload needed a retry
        if: steps.upload.outcome == 'failure'
        run: echo "::warning::the artifact upload failed once and succeeded on retry"
